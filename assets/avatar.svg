<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="teal-glow" cx="50" cy="50" r="45">
      <stop offset="0%" style="stop-color:#14b8a6; stop-opacity: 0.8"/>
      <stop offset="100%" style="stop-color:#14b8a6; stop-opacity: 0.1"/>
    </radialGradient>
    <linearGradient id="hoodie-gradient" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#0d0d1f"/>

  <!-- Teal glow behind figure - more prominent -->
  <circle cx="50" cy="50" r="38" fill="url(#teal-glow)" opacity="0.7"/>

  <!-- Hoodie figure -->
  <g>
    <!-- Hoodie outline -->
    <path d="M 30 40 Q 50 30 70 40 Z" 
          fill="url(#hoodie-gradient)" 
          stroke="#1a202c" 
          stroke-width="2"/>

    <!-- Simplified hair - just a curve -->
    <path d="M 38 45 Q 50 50 L 62 38" 
          fill="none" 
          stroke="#14b8a6" 
          stroke-width="4" 
          stroke-linecap="round"/>

    <!-- Anonymous square -->
    <rect x="42" y="35" width="16" height="16" 
          fill="#1a202c" 
          stroke="#14b8a6" 
          stroke-width="2"/>
  </g>
</svg>
