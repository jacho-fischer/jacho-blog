<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="avatar-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#avatar-gradient)" stroke-width="4" opacity="0.8"/>

  <!-- Inner circle -->
  <circle cx="50" cy="50" r="35" fill="url(#avatar-gradient)" opacity="0.95"/>

  <!-- Stylized J letter -->
  <path d="M 38 70 L 38 50 L 50 50 L 50 70 L 62 70 L 62 35 L 50 35 Z" 
        fill="none" 
        stroke="#1a1a1a" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner accent dot -->
  <circle cx="50" cy="60" r="6" fill="#f97316" opacity="0.9"/>
</svg>
